name: Monitor and Build Caddy Docker Proxy

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC
  workflow_dispatch: # Manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest versions
        id: get_versions
        uses: actions/github-script@v7
        with:
          script: |
            const proxyRepo = 'lucaslorentz/caddy-docker-proxy';
            const duckdnsRepo = 'caddy-dns/duckdns';
            
            const proxyRelease = await github.rest.repos.getLatestRelease({
              owner: proxyRepo.split('/')[0],
              repo: proxyRepo.split('/')[1],
            });
            
            const duckdnsRelease = await github.rest.repos.getLatestRelease({
              owner: duckdnsRepo.split('/')[0],
              repo: duckdnsRepo.split('/')[1],
            });
            
            core.setOutput('proxy_version', proxyRelease.data.tag_name);
            core.setOutput('duckdns_version', duckdnsRelease.data.tag_name);
            console.log(`Latest Proxy Version: ${proxyRelease.data.tag_name}`);
            console.log(`Latest DuckDNS Version: ${duckdnsRelease.data.tag_name}`);

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists
        id: check_image
        run: |
          PROXY_VER=${{ steps.get_versions.outputs.proxy_version }}
          DUCKDNS_VER=${{ steps.get_versions.outputs.duckdns_version }}
          TAG="${PROXY_VER}-${DUCKDNS_VER}"
          FULL_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          
          if docker manifest inspect $FULL_IMAGE > /dev/null 2>&1; then
            echo "Image $FULL_IMAGE already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Image $FULL_IMAGE does not exist. Proceeding with build."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        if: steps.check_image.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: |
            CADDY_DOCKER_PROXY_VERSION=${{ steps.get_versions.outputs.proxy_version }}
            CADDY_DNS_DUCKDNS_VERSION=${{ steps.get_versions.outputs.duckdns_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.get_versions.outputs.proxy_version }}-${{ steps.get_versions.outputs.duckdns_version }}
          cache-from: type=gha
          cache-to: type=inline
