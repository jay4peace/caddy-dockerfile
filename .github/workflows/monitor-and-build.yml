name: Monitor and Build Caddy Docker Proxy

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC
  workflow_dispatch: # Manual trigger

env:
  REGISTRY: ghcr.io

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest versions
        id: get_versions
        uses: actions/github-script@v7
        with:
          script: |
            const proxyRepo = { owner: 'lucaslorentz', repo: 'caddy-docker-proxy' };
            const duckdnsRepo = { owner: 'caddy-dns', repo: 'duckdns' };

            // caddy-docker-proxy uses GitHub Releases
            const proxyRelease = await github.rest.repos.getLatestRelease(proxyRepo);
            const proxyVersion = proxyRelease.data.tag_name;

            // caddy-dns/duckdns may not have Releases — fall back to latest tag
            let duckdnsVersion;
            try {
              const duckdnsRelease = await github.rest.repos.getLatestRelease(duckdnsRepo);
              duckdnsVersion = duckdnsRelease.data.tag_name;
            } catch (e) {
              console.log('No GitHub Release found for caddy-dns/duckdns, falling back to latest tag.');
              const tags = await github.rest.repos.listTags({ ...duckdnsRepo, per_page: 1 });
              if (tags.data.length === 0) {
                core.setFailed('No releases or tags found for caddy-dns/duckdns');
                return;
              }
              duckdnsVersion = tags.data[0].name;
            }

            // Normalize image path to lowercase for GHCR compatibility
            const imageName = context.repo.owner.toLowerCase() + '/caddy-proxy-duckdns';

            core.setOutput('proxy_version', proxyVersion);
            core.setOutput('duckdns_version', duckdnsVersion);
            core.setOutput('image_name', imageName);
            console.log(`Proxy: ${proxyVersion}, DuckDNS: ${duckdnsVersion}, Image: ${imageName}`);

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image exists
        id: check_image
        # Skip check on manual trigger — always rebuild
        if: github.event_name != 'workflow_dispatch'
        env:
          PROXY_VER: ${{ steps.get_versions.outputs.proxy_version }}
          DUCKDNS_VER: ${{ steps.get_versions.outputs.duckdns_version }}
          IMAGE_NAME: ${{ steps.get_versions.outputs.image_name }}
        run: |
          TAG="${PROXY_VER}-${DUCKDNS_VER}"
          FULL_IMAGE="${{ env.REGISTRY }}/${IMAGE_NAME}:${TAG}"

          if docker manifest inspect "${FULL_IMAGE}" > /dev/null 2>&1; then
            echo "Image ${FULL_IMAGE} already exists. Skipping build."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Image ${FULL_IMAGE} does not exist. Proceeding with build."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        # Build if: new version detected (exists=false) OR manual trigger (check_image was skipped)
        if: steps.check_image.outputs.exists != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            CADDY_DOCKER_PROXY_VERSION=${{ steps.get_versions.outputs.proxy_version }}
            CADDY_DNS_DUCKDNS_VERSION=${{ steps.get_versions.outputs.duckdns_version }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.get_versions.outputs.image_name }}:latest
            ${{ env.REGISTRY }}/${{ steps.get_versions.outputs.image_name }}:${{ steps.get_versions.outputs.proxy_version }}-${{ steps.get_versions.outputs.duckdns_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
